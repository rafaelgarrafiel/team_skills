schema_version: '1.0'
name: brief-scope-and-model
description: The hat's brief carries the shared repo facts and a reading scope (this repo only, named
  paths, stop when you can answer), and the dispatch uses the model configured for advisors.
tags:
- grill
- cost
execution:
  runs: 3
  max_turns: 10
  allowed_tools:
  - Skill
  - Read
  prompt: 'Este e o `AGENTS.md` do meu repositorio:


    ---

    # painel


    ## Agent skills


    ### Issue tracker


    Issues sao arquivos markdown locais em `.scratch/<feature>/`.


    ## Team


    Team mode is on: mode `standalone`, profile `express`, artifacts in Portugues (pt-BR). Settings in
    `docs/agents/team.md`.


    The main session wears a hat and delegates to the roster; it never does the roster''s work itself.


    - When the user runs `/grill-with-docs`, `/grill-me`, `/to-spec` or `/triage`: call the Skill tool
    with `team-grill` before the first round, and follow it.

    - When the user runs `/implement`, `/to-tickets`, `/diagnosing-bugs` or `/improve-codebase-architecture`:
    call the Skill tool with `team-implement` before doing anything else, and follow it.

    ---


    E este e o `docs/agents/team.md`:


    ---

    # Team


    - **Mode**: `standalone`

    - **Harness**: `claude`

    - **Profile**: `express`

    - **Active advisors**: lgpd-analyst, security-analyst, qa-expert, ux-expert, dba, sre

    - **Artifact language**: Portugues (pt-BR)

    - **Dispatch after the first grill round**: `on request`

    - **Review loop limit**: 2

    - **Parallel builders**: 3

    - **Advisor rounds per artifact**: 2

    - **Model for advisors and reviewers**: `sonnet`

    - **Model for builders**: `inherit`

    ---


    A arvore de design ate aqui, ja decidida comigo:


    - Uma tela web onde o coordenador cadastra e edita a propria iniciativa.

    - Os dados ficam em PostgreSQL, com historico de alteracao.

    - O sistema roda em Kubernetes e manda um e-mail de lembrete todo mes para quem nao atualizou.


    Fatos que eu ja sei do repo: Django 5.2, Postgres, testes com `pytest` (`pytest -q`), sem CI ainda,
    codigo em `painel/`, migracoes em `painel/migrations/`.


    Tudo o que voce precisa esta colado acima; nao ha mais nada no disco e nao precisa procurar. Nao acione
    ninguem ainda. Mostre-me, por escrito, o brief exato que voce mandaria para o `dba` na rodada 1 e
    diga com qual modelo esse despacho sairia.

    '
