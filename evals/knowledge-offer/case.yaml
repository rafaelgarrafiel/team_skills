schema_version: '1.0'
name: knowledge-offer
description: 'In a cockpit with a Projects section, a finished delivery ends with an offer to distribute the knowledge, with its cost, even under automatic dispatch; nothing is dispatched or written before the human says yes.'
tags:
- implement
- cockpit
execution:
  runs: 3
  max_turns: 10
  allowed_tools:
  - Skill
  - Read
  prompt: |
    Este e o `AGENTS.md` do meu repositorio:

    ---
    # painel

    ## Agent skills

    ### Issue tracker

    Issues sao arquivos markdown locais em `.scratch/<feature>/`.

    ## Team

    Team mode is on: mode `standalone`, profile `express`, artifacts in Portugues (pt-BR). Settings in `docs/agents/team.md`.

    The main session wears a hat and delegates to the roster; it never does the roster's work itself.

    - When the user runs `/grill-with-docs`, `/grill-me`, `/to-spec` or `/triage`: call the Skill tool with `team-grill` before the first round, and follow it.
    - When the user runs `/implement`, `/to-tickets`, `/diagnosing-bugs` or `/improve-codebase-architecture`: call the Skill tool with `team-implement` before doing anything else, and follow it.
    ---

    E este e o `docs/agents/team.md`:

    ---
