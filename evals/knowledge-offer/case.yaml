    Estado final em `.scratch/relatorios/team/state.md`:

    ---
    | Ticket | State | Branch | Loops | Reviewers returned | Note |
    |---|---|---|---|---|---|
    | 01-endpoint | merged | team/relatorios/01-endpoint | 0 | | |
    | 02-tela | merged | team/relatorios/02-tela | 1 | qa | |
