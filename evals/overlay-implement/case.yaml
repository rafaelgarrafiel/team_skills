schema_version: '1.0'
name: overlay-implement
description: The Tech Lead hat fires when the user asks to build a ticket in a team-mode repo, and the
  main session delegates instead of coding.
tags:
- overlay
- implement
execution:
  runs: 3
  max_turns: 10
  allowed_tools:
  - Skill
  - Read
  prompt: 'Este e o `AGENTS.md` do meu repositorio:


    ---

    # painel


    ## Agent skills


    ### Issue tracker


    Issues sao arquivos markdown locais em `.scratch/<feature>/`.


    ## Team


    Team mode is on: mode `standalone`, profile `express`, artifacts in Portugues (pt-BR). Settings in
    `docs/agents/team.md`.


    The main session wears a hat and delegates to the roster; it never does the roster''s work itself.


    - When the user runs `/grill-with-docs`, `/grill-me`, `/to-spec` or `/triage`: call the Skill tool
    with `team-grill` before the first round, and follow it.

    - When the user runs `/implement`, `/to-tickets`, `/diagnosing-bugs` or `/improve-codebase-architecture`:
    call the Skill tool with `team-implement` before doing anything else, and follow it.

    ---


    E este e o `docs/agents/team.md`:


    ---

    # Team


    - **Mode**: `standalone`

    - **Harness**: `claude`

    - **Profile**: `express`

    - **Active advisors**: lgpd-analyst, security-analyst, qa-expert, ux-expert, dba, sre

    - **Artifact language**: Portugues (pt-BR)

    - **Dispatch after the first grill round**: `on request`

    - **Review loop limit**: 2

    - **Parallel builders**: 3

    - **Advisor rounds per artifact**: 2

    - **Model for advisors and reviewers**: `sonnet`

    - **Model for builders**: `inherit`

    ---


    E este e o ticket em `.scratch/painel/issues/01-cadastro.md`:


    ---

    # 01 - Cadastro de iniciativa


    **What to build:** Formulario para cadastrar uma iniciativa com nome, tipo e ponto focal (nome, e-mail),
    gravando em Postgres.


    **Blocked by:** None


    **Status:** ready-for-agent


    - [ ] Modelo `Iniciativa` com migracao

    - [ ] Formulario e tela de cadastro

    - [ ] Testes do formulario

    ---


    Tudo o que voce precisa esta colado acima; nao ha mais nada no disco e nao precisa procurar. Vamos
    implementar o ticket 01: me diga como voce vai conduzir isso, antes de mexer em qualquer arquivo.'
